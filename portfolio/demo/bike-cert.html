<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 로그인 · 본인인증 · 자전거행복나눔 | 박세훈 포트폴리오</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  .dm-top{position:sticky;top:0;z-index:9999;background:#12161f;color:#fff;
    font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;
    border-bottom:1px solid rgba(255,255,255,.12)}
  .dm-top *{box-sizing:border-box}
  .dm-in{max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .dm-back{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;
    border-radius:8px;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;
    font-size:13px;font-weight:700;white-space:nowrap;transition:background .18s}
  .dm-back:hover{background:rgba(255,255,255,.2)}
  .dm-ttl{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dm-badge{flex:0 0 auto;padding:3px 9px;border-radius:5px;background:#f26522;color:#fff;
    font-size:11.5px;font-weight:800;letter-spacing:.02em}
  .dm-name{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .dm-org{font-size:12.5px;color:rgba(255,255,255,.55);font-weight:600}
  .dm-note{flex:1 1 100%;margin:0;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);
    font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.68)}
  .dm-note b{color:#8fc0ff;font-weight:700}
  .dm-stage{background:#fff}
  @media(max-width:640px){ .dm-in{padding:12px 16px;gap:10px} .dm-name{font-size:14px} }

html,body{height:100%}
body{margin:0;background:#fff;color:#333;
  font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif}
.bk-stage{min-height:100vh;padding:96px 20px 64px;background:#fff}
.bk-login{max-width:450px;margin:0 auto}
/* 헤더 : 어두운 면이 사라졌으므로 잉크색으로 위계를 만든다 */
.bk-login-header{padding:0 40px;margin-bottom:24px}
.bk-brand{font-size:28px;font-weight:300;color:#212121;line-height:1.3;letter-spacing:-.02em}
.bk-brand small{display:block;font-size:14px;color:#757575;padding-left:2px;margin-top:8px;font-weight:400}
/* 카드 : 채움 대신 얇은 테두리 */
.bk-login-content{padding:30px 40px;background:#fff;border:1px solid #e5e5e5;border-radius:3px}
.bk-p{margin:0 0 20px;font-size:14px;line-height:1.75;color:#555}
.bk-err{margin:0 0 20px;font-size:14px;line-height:1.75;color:#333}
/* 입력 : 흰 배경에서는 밑줄형이 원본의 without-border 의도에 가장 가깝다 */
.bk-field{margin-bottom:20px}
.bk-input{display:block;width:100%;height:46px;padding:0 2px;border:0;border-bottom:1px solid #e0e0e0;
  background:transparent;font-family:inherit;font-size:16px;color:#212121;transition:border-color .15s}
.bk-input::placeholder{color:#aaa}
.bk-input:focus{outline:none;border-bottom-color:#00BCD4}
.bk-chk{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:14px;color:#555;cursor:pointer}
.bk-chk input{width:16px;height:16px;accent-color:#00BCD4;cursor:pointer}
.bk-btn{display:block;width:100%;height:46px;border:1px solid #00BCD4;border-radius:3px;
  background:#00BCD4;color:#fff;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s}
.bk-btn:hover{background:#26C6DA;border-color:#26C6DA}
.bk-btn:active{background:#00ACC1}
.bk-btn--ghost{background:#fff;border-color:#e0e0e0;color:#555}
.bk-btn--ghost:hover{background:#f7f7f7;border-color:#ccc}
.bk-back{display:inline-block;margin-top:20px;font-size:13px;color:#757575;text-decoration:none}
.bk-back:hover{color:#212121;text-decoration:underline}
/* 단계 전환 */
.bk-step{display:none}
.bk-step.on{display:block;animation:bkIn .32s ease both}
@keyframes bkIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 진행 표시 */
.bk-flow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
.bk-flow span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#bbb}
.bk-flow span i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:#eee;color:#999;font-size:12px;font-weight:700;font-style:normal}
.bk-flow span.on{color:#212121}
.bk-flow span.on i{background:#00BCD4;color:#fff}
.bk-flow em{width:26px;height:1px;background:#e0e0e0;font-style:normal}
/* 상태 전환 토글 */
.bk-switch{max-width:450px;margin:24px auto 0;padding:12px 14px;border:1px solid #eee;border-radius:6px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafafa}
.bk-switch span{font-size:12px;font-weight:700;color:#999}
.bk-switch button{height:30px;padding:0 12px;border:1px solid #e0e0e0;border-radius:5px;background:#fff;
  color:#757575;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.bk-switch button.on{background:#212121;color:#fff;border-color:#212121}
/* 팝업 차단 폴백 */
.bk-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.45)}
.bk-modal.on{display:flex}
.bk-modal iframe{width:500px;max-width:100%;height:550px;max-height:88vh;border:0;border-radius:6px;background:#fff}
.bk-modal button{position:absolute;top:18px;right:20px;width:36px;height:36px;border:0;border-radius:8px;
  background:rgba(255,255,255,.9);color:#333;font-size:20px;cursor:pointer}

/* ── 튜토리얼 : 대상 요소를 비추고 설명을 붙인다 ── */
.tut[hidden]{display:none}
.tut{position:fixed;inset:0;z-index:99999;pointer-events:auto;cursor:default;
  overscroll-behavior:contain;-webkit-user-select:none;user-select:none;
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif}
/* 튜토리얼 동안 본문은 선택·드래그 불가 (스크롤은 스크립트가 막는다) */
html.tut-lock, html.tut-lock body{-webkit-user-select:none;user-select:none}
html.tut-lock body{cursor:default}
.tut__ring{position:absolute;border-radius:10px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(0,12,30,.66), 0 0 0 3px #3182f6;
  transition:top .32s cubic-bezier(.22,1,.36,1),left .32s cubic-bezier(.22,1,.36,1),
             width .32s cubic-bezier(.22,1,.36,1),height .32s cubic-bezier(.22,1,.36,1)}
.tut__pop{position:absolute;pointer-events:auto;width:min(360px,calc(100vw - 32px));padding:18px 20px 16px;
  background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,12,30,.36);
  transition:top .32s cubic-bezier(.22,1,.36,1),left .32s cubic-bezier(.22,1,.36,1)}
.tut__no{display:flex;align-items:center;gap:7px;margin:0 0 8px;
  font-size:12px;font-weight:800;letter-spacing:.06em;color:#3182f6}
.tut__no i{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#3182f6;font-style:normal}
.tut__txt{margin:0;font-size:14px;line-height:1.72;color:#333d4b;word-break:keep-all}
.tut__txt b{font-weight:700;color:#191f28}
.tut__acts{display:flex;align-items:center;gap:8px;margin-top:16px}
.tut__acts button{height:36px;padding:0 14px;border:0;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-.01em}
.tut__skip{margin-right:auto;background:none;color:#8b95a1}
.tut__skip:hover{color:#4e5968}
.tut__prev{background:#f2f4f6;color:#4e5968}
.tut__prev:hover{background:#e5e8eb}
.tut__prev[disabled]{opacity:.4;cursor:default}
.tut__next{background:#3182f6;color:#fff}
.tut__next:hover{background:#2272eb}
@media(max-width:640px){
  .tut__pop{width:calc(100vw - 24px);left:12px !important}
}
@media(prefers-reduced-motion:reduce){
  .tut__ring,.tut__pop{transition:none}
}
/* 상시 노출 : 튜토리얼을 다시 부르는 버튼 */
.tut-open{position:fixed;right:16px;bottom:16px;z-index:9998;display:inline-flex;align-items:center;gap:7px;
  height:38px;padding:0 15px;border:0;border-radius:999px;cursor:pointer;
  background:#3182f6;color:#fff;box-shadow:0 6px 18px rgba(49,130,246,.34);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:-.01em;transition:background .16s,transform .16s}
.tut-open:hover{background:#2272eb;transform:translateY(-2px)}
.tut-open svg{width:15px;height:15px;flex:0 0 15px}
.tut:not([hidden]) ~ .tut-open{display:none}
@media(prefers-reduced-motion:reduce){ .tut-open:hover{transform:none} }
</style>
</head>
<body>

<div class="bk-stage">
  <div class="bk-login">

    <div class="bk-flow" id="bkFlow">
      <span class="on" data-f="1"><i>1</i>관리자 로그인</span>
      <em></em>
      <span data-f="2"><i>2</i>본인인증</span>
    </div>

    <!-- STEP 1 : 관리자 로그인 -->
    <div class="bk-step on" id="bkStep1">
      <div class="bk-login-header">
        <div class="bk-brand">관리자 로그인<small>자전거행복나눔 관리자</small></div>
      </div>
      <div class="bk-login-content">
        <form id="bkForm" autocomplete="off">
          <div class="bk-field">
            <input class="bk-input" type="text" id="userId" placeholder="아이디 입력" value="admin">
          </div>
          <div class="bk-field">
            <input class="bk-input" type="password" id="userPw" placeholder="비밀번호 입력" value="********">
          </div>
          <label class="bk-chk"><input type="checkbox" id="saveId"> 아이디 기억하기</label>
          <button type="submit" class="bk-btn">로그인</button>
        </form>
      </div>
    </div>

    <!-- STEP 2 : 본인인증 -->
    <div class="bk-step" id="bkStep2">
      <div class="bk-login-header">
        <div class="bk-brand">본인인증<small>관리자 로그인을 위해 본인인증을 진행해 주세요.</small></div>
      </div>

      <div class="bk-login-content" id="bkOk">
        <p class="bk-p">아래 버튼을 클릭하여 본인인증을 완료해 주세요.<br>인증 완료 후 자동으로 로그인됩니다.</p>
        <button type="button" class="bk-btn" id="bkGo">본인인증 진행</button>
        <a class="bk-back" href="#none" id="bkBack">← 로그인 페이지로 돌아가기</a>
      </div>

      <div class="bk-login-content" id="bkNg" style="display:none">
        <p class="bk-err">암호화 시스템 에러입니다.</p>
        <button type="button" class="bk-btn bk-btn--ghost" id="bkBack2">로그인 페이지로 돌아가기</button>
      </div>
    </div>

  </div>

  <div class="bk-switch" id="bkSwitch">
    <span>화면 상태</span>
    <button type="button" class="on" data-st="ok">정상</button>
    <button type="button" data-st="ng">암호화 실패</button>
  </div>
</div>

<div class="bk-modal" id="bkModal">
  <button type="button" aria-label="닫기" onclick="document.getElementById('bkModal').classList.remove('on')">&times;</button>
  <iframe src="" id="bkFrame" title="본인인증 창"></iframe>
</div>

<script>
(function(){
  /* 로그인 성공 시 세션을 바로 열지 않고 본인인증 페이지로 넘긴다 (원본 A_SsoController 흐름) */
  function goStep(n){
    document.getElementById('bkStep1').classList.toggle('on', n === 1);
    document.getElementById('bkStep2').classList.toggle('on', n === 2);
    document.querySelectorAll('.bk-flow span').forEach(function(s){
      s.classList.toggle('on', Number(s.dataset.f) <= n);
    });
    document.getElementById('bkSwitch').style.display = n === 2 ? '' : 'none';
    window.scrollTo(0, 0);
  }
  document.getElementById('bkForm').addEventListener('submit', function(e){
    e.preventDefault();
    goStep(2);
  });
  document.getElementById('bkBack').addEventListener('click', function(e){ e.preventDefault(); goStep(1); });
  document.getElementById('bkBack2').addEventListener('click', function(){ goStep(1); });

  document.querySelectorAll('.bk-switch button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.bk-switch button').forEach(function(x){ x.classList.remove('on') });
      b.classList.add('on');
      var ok = b.dataset.st === 'ok';
      document.getElementById('bkOk').style.display = ok ? '' : 'none';
      document.getElementById('bkNg').style.display = ok ? 'none' : '';
    });
  });

  document.getElementById('bkGo').addEventListener('click', function(){
    var w = window.open('nice-popup.html', 'popupChk',
      'width=500,height=550,top=100,left=100,menubar=no,status=no,toolbar=no,location=no,scrollbars=no');
    if (!w || w.closed || typeof w.closed === 'undefined') {   // 팝업 차단 폴백
      document.getElementById('bkFrame').src = 'nice-popup.html';
      document.getElementById('bkModal').classList.add('on');
    }
  });

  goStep(1);
})();
</script>


<div class="tut" id="tut" hidden>
  <div class="tut__ring" id="tutRing"></div>
  <div class="tut__pop" id="tutPop">
    <p class="tut__no"><i></i><span id="tutNo">1 / 4</span></p>
    <p class="tut__txt" id="tutTxt"></p>
    <div class="tut__acts">
      <button type="button" class="tut__skip" id="tutSkip">건너뛰기</button>
      <button type="button" class="tut__prev" id="tutPrev">이전</button>
      <button type="button" class="tut__next" id="tutNext">다음</button>
    </div>
  </div>
</div>
<button type="button" class="tut-open" id="tutOpen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
  설명 보기
</button>

<script>
(function(){
  var KEY = 'tut:bike';
  var STEPS = [{"sel": ".bk-flow", "txt": "관리자 로그인 후 <b>본인인증을 한 번 더 진행합니다.</b>"}, {"sel": "#bkStep1 .bk-login-content", "txt": "먼저 <b>아이디와 비밀번호를 확인합니다.</b> 로그인에 성공하면 본인인증으로 넘어갑니다."}, {"sel": "#bkStep2 .bk-login-content", "txt": "본인인증을 완료해야 <b>관리자 화면으로 이동합니다.</b>", "before": "var f=document.getElementById(\"bkForm\");if(f && !document.getElementById(\"bkStep2\").classList.contains(\"on\")){f.dispatchEvent(new Event(\"submit\",{bubbles:true,cancelable:true}));}"}, {"sel": "#bkGo", "txt": "인증 버튼을 누르면 <b>500×550 크기의 인증 창이 열립니다.</b> 팝업이 차단되면 화면 안에서 바로 이어서 진행합니다."}, {"sel": ".bk-switch", "txt": "인증 실패는 <b>상황에 따라 안내를 다르게 보여줍니다.</b> 다시 시도하면 되는 경우와 관리자 확인이 필요한 경우를 구분합니다."}];
  var el = document.getElementById('tut'), ring = document.getElementById('tutRing'),
      pop = document.getElementById('tutPop'), no = document.getElementById('tutNo'),
      txt = document.getElementById('tutTxt'), prev = document.getElementById('tutPrev'),
      next = document.getElementById('tutNext'), skip = document.getElementById('tutSkip');
  var i = 0;

  function place(step){
    if(step.before){ try{ (new Function(step.before))(); }catch(e){} }
    var t = document.querySelector(step.sel);
    if(!t){ return false; }
    t.scrollIntoView({block:'center', behavior:'smooth'});
    setTimeout(function(){
      var r = t.getBoundingClientRect(), pad = 6;
      ring.style.top    = (r.top - pad) + 'px';
      ring.style.left   = (r.left - pad) + 'px';
      ring.style.width  = (r.width + pad*2) + 'px';
      ring.style.height = (r.height + pad*2) + 'px';
      var pw = Math.min(360, window.innerWidth - 32), ph = pop.offsetHeight || 180;
      var top = r.bottom + 14, left = r.left;
      if(top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 14);
      if(left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
      pop.style.top = Math.max(12, top) + 'px';
      pop.style.left = Math.max(12, left) + 'px';
    }, 220);
    setTimeout(function(){                       // 스크롤이 멎은 뒤 재보정
      var r2 = t.getBoundingClientRect(), pad = 6;
      ring.style.top = (r2.top - pad) + 'px';
      ring.style.left = (r2.left - pad) + 'px';
      ring.style.width = (r2.width + pad*2) + 'px';
      ring.style.height = (r2.height + pad*2) + 'px';
      var pw2 = Math.min(360, window.innerWidth - 32), ph2 = pop.offsetHeight || 180;
      var top2 = r2.bottom + 14, left2 = r2.left;
      if(top2 + ph2 > window.innerHeight - 12) top2 = Math.max(12, r2.top - ph2 - 14);
      if(left2 + pw2 > window.innerWidth - 12) left2 = window.innerWidth - pw2 - 12;
      pop.style.top = Math.max(12, top2) + 'px';
      pop.style.left = Math.max(12, left2) + 'px';
    }, 620);
    return true;
  }

  function show(n){
    i = Math.max(0, Math.min(STEPS.length - 1, n));
    var s = STEPS[i];
    no.textContent = (i+1) + ' / ' + STEPS.length;
    txt.innerHTML = s.txt;
    prev.disabled = i === 0;
    next.textContent = i === STEPS.length - 1 ? '완료' : '다음';
    place(s);
  }

  /* ── 튜토리얼 중 외부 조작 차단 ──
     스포트라이트가 가리키는 곳이 바뀌면 안 되므로 사용자 스크롤·클릭·포커스 이동을 막는다.
     스크립트가 부르는 scrollIntoView 는 이벤트가 아니라서 그대로 동작한다. */
  var SCROLLS = ['wheel','mousewheel','DOMMouseScroll','touchmove'];
  function eat(e){ e.preventDefault(); e.stopPropagation(); }
  function keyGuard(e){
    if(e.key === 'Escape' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') return;
    // 말풍선 버튼 위에서의 Enter / Space 는 살려 둔다
    if(pop.contains(e.target) && (e.key === 'Enter' || e.key === ' ')) return;
    e.preventDefault();          // 스크롤 키(Space·PageUp/Down·Home/End·↑↓) · Tab 이탈 차단
    e.stopPropagation();
  }
  function lock(){
    SCROLLS.forEach(function(t){ document.addEventListener(t, eat, {passive:false, capture:true}); });
    window.addEventListener('wheel', eat, {passive:false, capture:true});
    document.addEventListener('keydown', keyGuard, true);
    document.addEventListener('contextmenu', eat, true);
    document.documentElement.classList.add('tut-lock');
  }
  function unlock(){
    SCROLLS.forEach(function(t){ document.removeEventListener(t, eat, true); });
    window.removeEventListener('wheel', eat, true);
    document.removeEventListener('keydown', keyGuard, true);
    document.removeEventListener('contextmenu', eat, true);
    document.documentElement.classList.remove('tut-lock');
  }

  function open(){ el.hidden = false; lock(); show(0); next.focus(); }
  function close(){
    el.hidden = true;
    unlock();
    try{ sessionStorage.setItem(KEY, '1'); }catch(e){}
  }

  var openBtn = document.getElementById('tutOpen');
  if(openBtn) openBtn.addEventListener('click', open);

  next.addEventListener('click', function(){ i === STEPS.length - 1 ? close() : show(i+1); });
  prev.addEventListener('click', function(){ show(i-1); });
  skip.addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if(el.hidden) return;
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowRight') next.click();
    else if(e.key === 'ArrowLeft' && i > 0) prev.click();
  });
  window.addEventListener('resize', function(){ if(!el.hidden) place(STEPS[i]); });

  /* 부모(모달)에서 '설명 다시 보기' 요청 */
  window.addEventListener('message', function(e){
    if(e.data === 'tut:restart') open();
  });

  /* 탭 첫 진입에만 자동 실행 */
  var seen = false;
  try{ seen = sessionStorage.getItem(KEY) === '1'; }catch(e){}
  if(!seen) setTimeout(open, 420);
})();
</script>
</body>
</html>
